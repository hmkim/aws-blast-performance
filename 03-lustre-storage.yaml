AWSTemplateFormatVersion: '2010-09-09'
Description: 'BLAST Performance Test - FSx for Lustre linked to an S3 copy of the NCBI BLAST DB'

Parameters:
  ProjectName:
    Type: String
    Default: blast-perf-test

  BlastDbName:
    Type: String
    Default: nt
    Description: NCBI BLAST database to copy (must match the EFS stack if you compare the two)

  S3BucketName:
    Type: String
    Description: S3 bucket name prefix for the Lustre data repository (account id is appended)
    Default: blast-nt-db-lustre

  LustreStorageCapacity:
    Type: Number
    Default: 2400
    AllowedValues: [1200, 2400, 3600, 4800, 7200]
    Description: >-
      SCRATCH_2 capacity in GiB (1200, then multiples of 2400). nt is ~1,120 GiB (2026-09),
      which would fill a 1200 GiB file system to ~93% - near-full OSTs degrade or hang Lustre,
      so 2400 is the default for nt. Throughput scales with capacity:
      SCRATCH_2 = 200 MB/s per TiB baseline (burst 1,300 MB/s per TiB), i.e. ~470 MB/s at 2400 GiB.
      For a smoke test with a small DB use 1200.

  CopyInstanceType:
    Type: String
    Default: m6i.large
    Description: >-
      The copy is an S3->S3 server-side copy (no data flows through the instance),
      so a small instance is enough.

Resources:
  S3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${S3BucketName}-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  LustreFileSystem:
    Type: AWS::FSx::FileSystem
    Properties:
      FileSystemType: LUSTRE
      # SCRATCH_2 defaults to Lustre 2.10, which the Amazon Linux 2023 client (2.15) cannot
      # mount: "Server MGS version (2.10.5.0) refused connection from this client with an
      # incompatible version (2.15.6)". 2.15 is mountable by AL2 (2.12 client) and AL2023.
      FileSystemTypeVersion: '2.15'
      StorageCapacity: !Ref LustreStorageCapacity
      SubnetIds:
        - !ImportValue 
            Fn::Sub: ${ProjectName}-private-subnet-1
      SecurityGroupIds:
        - !ImportValue 
            Fn::Sub: ${ProjectName}-lustre-sg-id
      LustreConfiguration:
        DeploymentType: SCRATCH_2
        ImportPath: !Sub s3://${S3Bucket}/
        ExportPath: !Sub s3://${S3Bucket}/export/
        ImportedFileChunkSize: 1024
        # The bucket is EMPTY when this file system is created (the copy below runs afterwards).
        # Without an auto-import policy FSx only lists the objects present at creation time,
        # so /mnt/lustre/<db> would stay empty. NEW_CHANGED makes later copies visible.
        AutoImportPolicy: NEW_CHANGED
        DataCompressionType: NONE
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-lustre-${BlastDbName}-db

  CopyLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /${ProjectName}/lustre/db-s3-copy
      RetentionInDays: 14

  DBCopyInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
      Policies:
        - PolicyName: S3Copy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - arn:aws:s3:::ncbi-blast-databases/*
                  - arn:aws:s3:::ncbi-blast-databases
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:ListBucketMultipartUploads
                Resource: !GetAtt S3Bucket.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:AbortMultipartUpload
                  - s3:ListMultipartUploadParts
                Resource: !Sub ${S3Bucket.Arn}/*
        - PolicyName: SsmStatusParameter
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:PutParameter
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/*

  DBCopyInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref DBCopyInstanceRole

  DBCopyInstance:
    Type: AWS::EC2::Instance
    DependsOn:
      - CopyLogGroup
    Properties:
      ImageId: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'
      InstanceType: !Ref CopyInstanceType
      IamInstanceProfile: !Ref DBCopyInstanceProfile
      SubnetId: !ImportValue 
        Fn::Sub: ${ProjectName}-private-subnet-1
      SecurityGroupIds:
        - !ImportValue 
            Fn::Sub: ${ProjectName}-batch-sg-id
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 30
            VolumeType: gp3
            Encrypted: true
      # NOTE: Fn::Sub template - shell variables are written as $VAR (no braces).
      UserData:
        Fn::Base64: !Sub |
          Content-Type: multipart/mixed; boundary="//"
          MIME-Version: 1.0

          --//
          Content-Type: text/cloud-config; charset="us-ascii"
          MIME-Version: 1.0
          Content-Transfer-Encoding: 7bit
          Content-Disposition: attachment; filename="cloud-config.txt"

          #cloud-config
          # Run the user-data script on every boot (a CloudFormation UserData update stops and
          # starts the same instance; without this the new script would never run).
          cloud_final_modules:
          - [scripts-user, always]

          --//
          Content-Type: text/x-shellscript; charset="us-ascii"
          MIME-Version: 1.0
          Content-Transfer-Encoding: 7bit
          Content-Disposition: attachment; filename="userdata.txt"

          #!/bin/bash
          set -euo pipefail

          dnf install -y amazon-cloudwatch-agent
          cat > /opt/aws/amazon-cloudwatch-agent/etc/config.json <<'EOF'
          {
            "logs": {
              "logs_collected": {
                "files": {
                  "collect_list": [
                    {
                      "file_path": "/var/log/db-s3-copy.log",
                      "log_group_name": "/${ProjectName}/lustre/db-s3-copy",
                      "log_stream_name": "{instance_id}"
                    }
                  ]
                }
              }
            }
          }
          EOF
          /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl \
            -a fetch-config -m ec2 -s \
            -c file:/opt/aws/amazon-cloudwatch-agent/etc/config.json

          exec > >(tee -a /var/log/db-s3-copy.log) 2>&1

          DB=${BlastDbName}
          REGION=${AWS::Region}
          SRC_REGION=us-east-1          # s3://ncbi-blast-databases lives here
          DEST=s3://${S3Bucket}/$DB/
          LATEST=unknown
          STATUS=failed
          T0=$(date +%s)

          # Whatever happens below, leave a status for run_tests.sh and stop this instance.
          # Cost guard: the host has no further purpose once the copy is done or has failed.
          finish() {
            aws ssm put-parameter \
              --name "/${ProjectName}/lustre/db-s3-copy-status" \
              --value "$STATUS:$DB:$LATEST:$(( $(date +%s) - T0 ))s" \
              --type String --overwrite --region $REGION || true
            sleep 60    # let the CloudWatch agent flush
            shutdown -h now
          }
          trap finish EXIT

          LATEST=$(aws s3 cp s3://ncbi-blast-databases/latest-dir - --region $SRC_REGION)
          SRC=s3://ncbi-blast-databases/$LATEST/

          # Idempotency: a previous boot may already have finished this copy.
          if [ "$(aws s3 cp $DEST/SOURCE_PREFIX - --region $REGION 2>/dev/null || true)" = "$LATEST" ]; then
            echo "$(date -u +%FT%TZ) $DEST already holds $DB from $LATEST -- nothing to copy"
            STATUS=completed
            exit 0
          fi

          # NCBI stores unpacked volume files under a dated prefix; copy only this DB.
          aws configure set default.s3.max_concurrent_requests 32
          if [ "$REGION" = "$SRC_REGION" ]; then
            # Same region: server-side copy. No bytes pass through this host and the S3 gateway
            # endpoint makes it free of NAT charges.
            echo "$(date -u +%FT%TZ) server-side copy $DB from $SRC to $DEST"
            aws s3 sync $SRC $DEST --region $REGION --only-show-errors \
              --exclude "*" --include "$DB.*" --include "$DB-nucl-metadata.json" --include "taxdb.*"
          else
            # Other region: a server-side CopyObject whose source is in another region is rejected
            # by the S3 gateway endpoint ("VPC endpoints do not support cross-region requests"),
            # so stream each object through this host instead. Bytes leave us-east-1 at the
            # inter-region rate and enter here through the NAT gateway (~$0.045/GB) -- the reason
            # README recommends running the nt benchmark in us-east-1.
            echo "$(date -u +%FT%TZ) cross-region stream copy $DB from $SRC ($SRC_REGION) to $DEST ($REGION)"
            aws s3api list-objects-v2 --bucket ncbi-blast-databases --prefix "$LATEST/" \
              --region $SRC_REGION --query 'Contents[].Key' --output text | tr '\t' '\n' \
              | grep -E "/($DB\.[A-Za-z0-9.]+|$DB-nucl-metadata\.json|taxdb\..*)$" > /tmp/keys.txt
            echo "$(wc -l < /tmp/keys.txt) objects to copy"
            cat > /tmp/copy_one.sh <<'EOS'
          #!/bin/bash
          set -euo pipefail
          KEY="$1"; SRC_REGION="$2"; DEST="$3"; REGION="$4"
          SIZE=$(aws s3api head-object --bucket ncbi-blast-databases --key "$KEY" --region "$SRC_REGION" --query ContentLength --output text)
          aws s3 cp "s3://ncbi-blast-databases/$KEY" - --region "$SRC_REGION" --only-show-errors \
            | aws s3 cp - "$DEST$(basename "$KEY")" --region "$REGION" --only-show-errors --expected-size "$SIZE"
          EOS
            chmod +x /tmp/copy_one.sh
            xargs -a /tmp/keys.txt -P 8 -I{} /tmp/copy_one.sh {} "$SRC_REGION" "$DEST" "$REGION"
          fi
          T1=$(date +%s)
          echo "$(date -u +%FT%TZ) copy finished in $((T1 - T0)) seconds"
          echo "$LATEST" | aws s3 cp - $DEST/SOURCE_PREFIX --region $REGION
          aws s3 ls $DEST --recursive --summarize --region $REGION | tail -2
          STATUS=completed
          --//--

      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-lustre-db-copy

Outputs:
  LustreFileSystemId:
    Value: !Ref LustreFileSystem
    Export:
      Name: !Sub ${ProjectName}-lustre-id

  LustreMountName:
    Value: !GetAtt LustreFileSystem.LustreMountName
    Export:
      Name: !Sub ${ProjectName}-lustre-mount-name

  S3BucketName:
    Value: !Ref S3Bucket
    Export:
      Name: !Sub ${ProjectName}-lustre-s3-bucket

  DBCopyInstanceId:
    Value: !Ref DBCopyInstance
    Description: Copy instance (terminate it once the SSM parameter <ProjectName>/lustre/db-s3-copy-status reads completed)

  StagedDbPath:
    Value: !Sub /mnt/lustre/${BlastDbName}/${BlastDbName}
    Description: -db argument for blastn when the file system is mounted at /mnt/lustre
