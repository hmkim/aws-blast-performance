AWSTemplateFormatVersion: '2010-09-09'
Description: 'BLAST Performance Test - AWS Batch environment for 3 storage scenarios (EFS / FSx for Lustre / S3 -> local NVMe)'

Parameters:
  ProjectName:
    Type: String
    Default: blast-perf-test

  BlastDbName:
    Type: String
    Default: nt
    Description: Must match the value used in the EFS and Lustre stacks

  QueryS3Bucket:
    Type: String
    Description: S3 bucket for query files and results

  QueryS3Key:
    Type: String
    Default: queries/query.fasta
    Description: S3 key of the query FASTA

  LustreFileSystemId:
    Type: String
    Description: FSx for Lustre file system ID (output of the Lustre stack)

  LustreMountName:
    Type: String
    Description: FSx for Lustre mount name (output of the Lustre stack)

  BlastImage:
    Type: String
    Default: public.ecr.aws/ncbi-elasticblast/elasticblast-elb:1.4.0
    Description: >-
      Container image. The plain ncbi/blast image does NOT contain the AWS CLI, so the
      job scripts (aws s3 cp) fail in it. NCBI's ElasticBLAST image is ncbi/blast:2.17.0
      plus awscli, vmtouch and GNU parallel. Pin a tag; never use :latest for a benchmark.

  InstanceTypes:
    Type: CommaDelimitedList
    Default: r6id.12xlarge,r5d.12xlarge
    Description: >-
      Identical instance pool for all three scenarios so that CPU and RAM are held constant
      and only the storage layer differs. Must be d-type (local NVMe) with enough instance
      store for the DB: nt is ~1.2 TB, r6id.12xlarge has 2 x 1,425 GB, r5d.12xlarge 2 x 900 GB.
      With 384 GiB RAM the nt search is disk-bound (nt bytes-to-cache = 1,170 GB), which is
      the regime in which the storage layer actually matters. For a RAM-resident run use
      core_nt (272 GB to cache) on the same instances.

  JobVcpus:
    Type: Number
    Default: 48
    Description: vCPUs per job (also used for blastn -num_threads). r6id/r5d.12xlarge = 48.

  JobMemoryMiB:
    Type: Number
    Default: 370000
    Description: >-
      Memory per job in MiB. Must be below what the ECS agent reports as available on the
      instance (384 GiB installed -> roughly 386,000 MiB usable). ElasticBLAST uses RAM - 2 GB.

  BlastPasses:
    Type: Number
    Default: 2
    Description: >-
      Number of consecutive blastn passes per job. Pass 1 is cold (data read from the storage
      layer), pass 2+ is warm (served from the page cache when the DB fits in RAM). The
      difference isolates the storage-layer cost.

  JobTimeoutSeconds:
    Type: Number
    Default: 21600
    Description: Hard stop per job attempt (cost guard). 6 h default.

Resources:
  BatchServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: batch.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSBatchServiceRole

  BatchInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  BatchInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref BatchInstanceRole

  BatchJobRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !Sub arn:aws:s3:::${QueryS3Bucket}/*
                  - !Sub arn:aws:s3:::${QueryS3Bucket}
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !Sub
                    - arn:aws:s3:::${Bucket}/*
                    - Bucket: !ImportValue
                        Fn::Sub: ${ProjectName}-lustre-s3-bucket
                  - !Sub
                    - arn:aws:s3:::${Bucket}
                    - Bucket: !ImportValue
                        Fn::Sub: ${ProjectName}-lustre-s3-bucket

  # ------------------------------------------------------------------
  # Launch templates (host-level preparation that the container cannot do)
  # ------------------------------------------------------------------

  # Scenario 2: mount FSx for Lustre on the host before the ECS agent registers.
  LustreLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        UserData:
          Fn::Base64: !Sub |
            MIME-Version: 1.0
            Content-Type: multipart/mixed; boundary="==MYBOUNDARY=="

            --==MYBOUNDARY==
            Content-Type: text/x-shellscript; charset="us-ascii"

            #!/bin/bash
            set -euo pipefail
            # ECS-optimized Amazon Linux 2023 (AWS Batch default AMI). AL2 would need
            # `amazon-linux-extras install -y lustre` instead.
            dnf install -y lustre-client
            mkdir -p /mnt/lustre
            mount -t lustre -o relatime,flock \
              ${LustreFileSystemId}.fsx.${AWS::Region}.amazonaws.com@tcp:/${LustreMountName} /mnt/lustre
            df -h /mnt/lustre

            --==MYBOUNDARY==--

  # Scenario 3: format the instance-store NVMe disk(s) into a RAID0 ext4 volume at /mnt/nvme.
  # Without this, "/mnt/nvme" inside the container is just the container's overlay
  # filesystem on the ~30 GiB root EBS volume and a 1.2 TB download fails with ENOSPC.
  NvmeLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        UserData:
          Fn::Base64: |
            MIME-Version: 1.0
            Content-Type: multipart/mixed; boundary="==MYBOUNDARY=="

            --==MYBOUNDARY==
            Content-Type: text/x-shellscript; charset="us-ascii"

            #!/bin/bash
            set -euo pipefail
            dnf install -y mdadm
            DEVS=$(lsblk -dpno NAME,MODEL | awk '/Amazon EC2 NVMe Instance Storage/ {print $1}')
            N=$(echo $DEVS | wc -w)
            if [ "$N" -eq 0 ]; then echo "no instance-store NVMe found" >&2; exit 1; fi
            if [ "$N" -gt 1 ]; then
              mdadm --create /dev/md0 --level=0 --raid-devices=$N $DEVS --force --run
              DEV=/dev/md0
            else
              DEV=$DEVS
            fi
            mkfs.ext4 -F -E nodiscard -m 0 $DEV
            mkdir -p /mnt/nvme
            mount -o noatime $DEV /mnt/nvme
            chmod 1777 /mnt/nvme
            df -h /mnt/nvme

            --==MYBOUNDARY==--

  # ------------------------------------------------------------------
  # Scenario 1: EFS (DB pre-staged by the EFS stack)
  # ------------------------------------------------------------------
  ComputeEnvironmentEFS:
    Type: AWS::Batch::ComputeEnvironment
    Properties:
      Type: MANAGED
      ServiceRole: !GetAtt BatchServiceRole.Arn
      ComputeResources:
        Type: EC2
        AllocationStrategy: BEST_FIT_PROGRESSIVE
        MinvCpus: 0
        MaxvCpus: 384
        DesiredvCpus: 0
        InstanceTypes: !Ref InstanceTypes
        Ec2Configuration:
          - ImageType: ECS_AL2023
        Subnets:
          - !ImportValue 
              Fn::Sub: ${ProjectName}-private-subnet-1
          - !ImportValue 
              Fn::Sub: ${ProjectName}-private-subnet-2
        SecurityGroupIds:
          - !ImportValue 
              Fn::Sub: ${ProjectName}-batch-sg-id
        InstanceRole: !GetAtt BatchInstanceProfile.Arn
        Tags:
          Name: !Sub ${ProjectName}-efs-compute
          project: !Ref ProjectName
          scenario: efs

  JobQueueEFS:
    Type: AWS::Batch::JobQueue
    Properties:
      JobQueueName: !Sub ${ProjectName}-efs
      Priority: 1
      ComputeEnvironmentOrder:
        - Order: 1
          ComputeEnvironment: !Ref ComputeEnvironmentEFS

  JobDefinitionEFS:
    Type: AWS::Batch::JobDefinition
    Properties:
      Type: container
      JobDefinitionName: !Sub ${ProjectName}-blastn-efs
      PlatformCapabilities:
        - EC2
      PropagateTags: true
      RetryStrategy:
        Attempts: 1
      Timeout:
        AttemptDurationSeconds: !Ref JobTimeoutSeconds
      ContainerProperties:
        Image: !Ref BlastImage
        ResourceRequirements:
          - Type: VCPU
            Value: !Ref JobVcpus
          - Type: MEMORY
            Value: !Ref JobMemoryMiB
        JobRoleArn: !GetAtt BatchJobRole.Arn
        Environment:
          - Name: SCENARIO
            Value: efs
          - Name: DB_PATH
            Value: !Sub /mnt/efs/${BlastDbName}/${BlastDbName}
          - Name: QUERY_S3_BUCKET
            Value: !Ref QueryS3Bucket
          - Name: QUERY_S3_KEY
            Value: !Ref QueryS3Key
          - Name: NUM_THREADS
            Value: !Ref JobVcpus
          - Name: PASSES
            Value: !Ref BlastPasses
          - Name: BLAST_USAGE_REPORT
            Value: 'false'
        Command:
          - /bin/bash
          - -c
          - |
            set -euo pipefail
            T_START=$(date +%s)
            echo "METRIC scenario=$SCENARIO job=$AWS_BATCH_JOB_ID"
            echo "METRIC instance_type=$(cat /sys/devices/virtual/dmi/id/product_name 2>/dev/null || echo unknown)"
            echo "METRIC blast_version=$(blastn -version | head -1 | awk '{print $2}')"
            aws s3 cp "s3://$QUERY_S3_BUCKET/$QUERY_S3_KEY" /tmp/query.fasta
            echo "METRIC db_setup_seconds=0 (pre-staged)"
            # taxdb.* sits next to the DB files; BLAST only finds it through BLASTDB, not the -db path.
            export BLASTDB="$(dirname "$DB_PATH")"
            blastdbcmd -db "$DB_PATH" -info > /tmp/dbinfo.txt; head -4 /tmp/dbinfo.txt
            for p in $(seq 1 "$PASSES"); do
              P0=$(date +%s)
              blastn -db "$DB_PATH" -query /tmp/query.fasta -num_threads "$NUM_THREADS" \
                -evalue 1.0E-3 -max_target_seqs 5 \
                -outfmt '6 qseqid qstart qend qcovs qcovhsp qcovus sseqid stitle sstart send evalue bitscore nident pident mismatch gaps sstrand staxids sscinames' \
                -out /tmp/results.pass$p.out
              P1=$(date +%s)
              echo "METRIC pass=$p blast_seconds=$((P1 - P0)) rows=$(wc -l < /tmp/results.pass$p.out) sha256=$(sort /tmp/results.pass$p.out | sha256sum | cut -c1-16)"
            done
            STAMP=$(date +%Y%m%d-%H%M%S)
            aws s3 cp /tmp/results.pass1.out "s3://$QUERY_S3_BUCKET/results/$SCENARIO/results-$STAMP.out"
            echo "METRIC total_seconds=$(( $(date +%s) - T_START ))"
        MountPoints:
          - SourceVolume: efs
            ContainerPath: /mnt/efs
            ReadOnly: true
        Volumes:
          - Name: efs
            EfsVolumeConfiguration:
              FileSystemId: !ImportValue 
                Fn::Sub: ${ProjectName}-efs-id
              TransitEncryption: ENABLED
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group: !Ref LogGroupEFS
            awslogs-region: !Ref AWS::Region
            awslogs-stream-prefix: blast

  LogGroupEFS:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /${ProjectName}/batch/efs
      RetentionInDays: 14

  # ------------------------------------------------------------------
  # Scenario 2: FSx for Lustre (DB lazy-loaded from the linked S3 bucket on first read)
  # ------------------------------------------------------------------
  ComputeEnvironmentLustre:
    Type: AWS::Batch::ComputeEnvironment
    Properties:
      Type: MANAGED
      ServiceRole: !GetAtt BatchServiceRole.Arn
      ComputeResources:
        Type: EC2
        AllocationStrategy: BEST_FIT_PROGRESSIVE
        MinvCpus: 0
        MaxvCpus: 384
        DesiredvCpus: 0
        InstanceTypes: !Ref InstanceTypes
        Ec2Configuration:
          - ImageType: ECS_AL2023
        Subnets:
          # FSx for Lustre is single-AZ: keep the compute in the file system's subnet
          # to avoid cross-AZ data charges and latency.
          - !ImportValue 
              Fn::Sub: ${ProjectName}-private-subnet-1
        SecurityGroupIds:
          - !ImportValue 
              Fn::Sub: ${ProjectName}-batch-sg-id
        InstanceRole: !GetAtt BatchInstanceProfile.Arn
        LaunchTemplate:
          LaunchTemplateId: !Ref LustreLaunchTemplate
          Version: !GetAtt LustreLaunchTemplate.LatestVersionNumber
        Tags:
          Name: !Sub ${ProjectName}-lustre-compute
          project: !Ref ProjectName
          scenario: lustre

  JobQueueLustre:
    Type: AWS::Batch::JobQueue
    Properties:
      JobQueueName: !Sub ${ProjectName}-lustre
      Priority: 1
      ComputeEnvironmentOrder:
        - Order: 1
          ComputeEnvironment: !Ref ComputeEnvironmentLustre

  JobDefinitionLustre:
    Type: AWS::Batch::JobDefinition
    Properties:
      Type: container
      JobDefinitionName: !Sub ${ProjectName}-blastn-lustre
      PlatformCapabilities:
        - EC2
      PropagateTags: true
      RetryStrategy:
        Attempts: 1
      Timeout:
        AttemptDurationSeconds: !Ref JobTimeoutSeconds
      ContainerProperties:
        Image: !Ref BlastImage
        ResourceRequirements:
          - Type: VCPU
            Value: !Ref JobVcpus
          - Type: MEMORY
            Value: !Ref JobMemoryMiB
        JobRoleArn: !GetAtt BatchJobRole.Arn
        Environment:
          - Name: SCENARIO
            Value: lustre
          - Name: DB_PATH
            Value: !Sub /mnt/lustre/${BlastDbName}/${BlastDbName}
          - Name: QUERY_S3_BUCKET
            Value: !Ref QueryS3Bucket
          - Name: QUERY_S3_KEY
            Value: !Ref QueryS3Key
          - Name: NUM_THREADS
            Value: !Ref JobVcpus
          - Name: PASSES
            Value: !Ref BlastPasses
          - Name: BLAST_USAGE_REPORT
            Value: 'false'
        Command:
          - /bin/bash
          - -c
          - |
            set -euo pipefail
            T_START=$(date +%s)
            echo "METRIC scenario=$SCENARIO job=$AWS_BATCH_JOB_ID"
            echo "METRIC instance_type=$(cat /sys/devices/virtual/dmi/id/product_name 2>/dev/null || echo unknown)"
            echo "METRIC blast_version=$(blastn -version | head -1 | awk '{print $2}')"
            aws s3 cp "s3://$QUERY_S3_BUCKET/$QUERY_S3_KEY" /tmp/query.fasta
            # Fail fast if the host did not mount FSx: an unmounted /mnt/lustre is an empty
            # directory and would otherwise surface as a confusing "No alias or index file" error.
            FSTYPE=$(stat -f -c %T /mnt/lustre 2>/dev/null || echo none)
            if [ "$FSTYPE" != "lustre" ]; then echo "ERROR /mnt/lustre is not a Lustre mount (fstype=$FSTYPE); check the launch template user data" >&2; exit 3; fi
            if [ ! -d "$(dirname "$DB_PATH")" ]; then echo "ERROR $(dirname "$DB_PATH") not present on FSx yet: the S3 copy may not have finished or auto-import is still catching up (ls /mnt/lustre: $(ls /mnt/lustre | tr "\n" " "))" >&2; exit 4; fi
            # Lustre lazy-loads file contents from S3 on first access. Pre-reading the DB
            # files with vmtouch (-t = touch into memory) makes the S3->Lustre hydration a
            # separately measured step; pass 1 then measures Lustre->client throughput.
            H0=$(date +%s)
            find "$(dirname "$DB_PATH")" -maxdepth 1 -type f -name "$(basename "$DB_PATH").*" -print0 \
              | parallel --will-cite -0 -j 16 vmtouch -tq {} || true
            H1=$(date +%s)
            echo "METRIC db_setup_seconds=$((H1 - H0)) (lustre hydration via vmtouch -t)"
            # taxdb.* sits next to the DB files; BLAST only finds it through BLASTDB, not the -db path.
            export BLASTDB="$(dirname "$DB_PATH")"
            blastdbcmd -db "$DB_PATH" -info > /tmp/dbinfo.txt; head -4 /tmp/dbinfo.txt
            for p in $(seq 1 "$PASSES"); do
              P0=$(date +%s)
              blastn -db "$DB_PATH" -query /tmp/query.fasta -num_threads "$NUM_THREADS" \
                -evalue 1.0E-3 -max_target_seqs 5 \
                -outfmt '6 qseqid qstart qend qcovs qcovhsp qcovus sseqid stitle sstart send evalue bitscore nident pident mismatch gaps sstrand staxids sscinames' \
                -out /tmp/results.pass$p.out
              P1=$(date +%s)
              echo "METRIC pass=$p blast_seconds=$((P1 - P0)) rows=$(wc -l < /tmp/results.pass$p.out) sha256=$(sort /tmp/results.pass$p.out | sha256sum | cut -c1-16)"
            done
            STAMP=$(date +%Y%m%d-%H%M%S)
            aws s3 cp /tmp/results.pass1.out "s3://$QUERY_S3_BUCKET/results/$SCENARIO/results-$STAMP.out"
            echo "METRIC total_seconds=$(( $(date +%s) - T_START ))"
        MountPoints:
          - SourceVolume: lustre
            ContainerPath: /mnt/lustre
            ReadOnly: true
        Volumes:
          - Name: lustre
            Host:
              SourcePath: /mnt/lustre
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group: !Ref LogGroupLustre
            awslogs-region: !Ref AWS::Region
            awslogs-stream-prefix: blast

  LogGroupLustre:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /${ProjectName}/batch/lustre
      RetentionInDays: 14

  # ------------------------------------------------------------------
  # Scenario 3: S3 -> local NVMe (baseline; what ElasticBLAST does per instance)
  # ------------------------------------------------------------------
  ComputeEnvironmentS3:
    Type: AWS::Batch::ComputeEnvironment
    Properties:
      Type: MANAGED
      ServiceRole: !GetAtt BatchServiceRole.Arn
      ComputeResources:
        Type: EC2
        AllocationStrategy: BEST_FIT_PROGRESSIVE
        MinvCpus: 0
        MaxvCpus: 384
        DesiredvCpus: 0
        InstanceTypes: !Ref InstanceTypes
        Ec2Configuration:
          - ImageType: ECS_AL2023
        Subnets:
          - !ImportValue 
              Fn::Sub: ${ProjectName}-private-subnet-1
          - !ImportValue 
              Fn::Sub: ${ProjectName}-private-subnet-2
        SecurityGroupIds:
          - !ImportValue 
              Fn::Sub: ${ProjectName}-batch-sg-id
        InstanceRole: !GetAtt BatchInstanceProfile.Arn
        LaunchTemplate:
          LaunchTemplateId: !Ref NvmeLaunchTemplate
          Version: !GetAtt NvmeLaunchTemplate.LatestVersionNumber
        Tags:
          Name: !Sub ${ProjectName}-s3-compute
          project: !Ref ProjectName
          scenario: s3-nvme

  JobQueueS3:
    Type: AWS::Batch::JobQueue
    Properties:
      JobQueueName: !Sub ${ProjectName}-s3
      Priority: 1
      ComputeEnvironmentOrder:
        - Order: 1
          ComputeEnvironment: !Ref ComputeEnvironmentS3

  JobDefinitionS3:
    Type: AWS::Batch::JobDefinition
    Properties:
      Type: container
      JobDefinitionName: !Sub ${ProjectName}-blastn-s3
      PlatformCapabilities:
        - EC2
      PropagateTags: true
      RetryStrategy:
        Attempts: 1
      Timeout:
        AttemptDurationSeconds: !Ref JobTimeoutSeconds
      ContainerProperties:
        Image: !Ref BlastImage
        ResourceRequirements:
          - Type: VCPU
            Value: !Ref JobVcpus
          - Type: MEMORY
            Value: !Ref JobMemoryMiB
        JobRoleArn: !GetAtt BatchJobRole.Arn
        Environment:
          - Name: SCENARIO
            Value: s3
          - Name: DB_NAME
            Value: !Ref BlastDbName
          # In-region copy made by the Lustre stack (same bytes the Lustre scenario reads),
          # so the S3 scenario measures in-region S3 -> NVMe, not cross-region from NCBI.
          - Name: DB_SOURCE_URI
            Value: !Sub
              - s3://${Bucket}/${BlastDbName}/
              - Bucket: !ImportValue
                  Fn::Sub: ${ProjectName}-lustre-s3-bucket
          - Name: DB_PATH
            Value: !Sub /mnt/nvme/${BlastDbName}/${BlastDbName}
          - Name: QUERY_S3_BUCKET
            Value: !Ref QueryS3Bucket
          - Name: QUERY_S3_KEY
            Value: !Ref QueryS3Key
          - Name: NUM_THREADS
            Value: !Ref JobVcpus
          - Name: PASSES
            Value: !Ref BlastPasses
          - Name: BLAST_USAGE_REPORT
            Value: 'false'
        Command:
          - /bin/bash
          - -c
          - |
            set -euo pipefail
            T_START=$(date +%s)
            echo "METRIC scenario=$SCENARIO job=$AWS_BATCH_JOB_ID"
            echo "METRIC instance_type=$(cat /sys/devices/virtual/dmi/id/product_name 2>/dev/null || echo unknown)"
            echo "METRIC blast_version=$(blastn -version | head -1 | awk '{print $2}')"
            df -h /mnt/nvme
            mkdir -p "/mnt/nvme/$DB_NAME"
            aws configure set default.s3.max_concurrent_requests 64
            D0=$(date +%s)
            # Same instance may serve several jobs: reuse the DB if a previous job completed it.
            if [ ! -f "/mnt/nvme/$DB_NAME/.done" ]; then
              aws s3 sync "$DB_SOURCE_URI" "/mnt/nvme/$DB_NAME/" --only-show-errors \
                --exclude "*" --include "$DB_NAME.*" --include "taxdb.*"
              touch "/mnt/nvme/$DB_NAME/.done"
            else
              echo "DB already present on this instance (warm instance)"
            fi
            D1=$(date +%s)
            BYTES=$(du -sb "/mnt/nvme/$DB_NAME" | cut -f1)
            SECS=$((D1 - D0)); [ "$SECS" -eq 0 ] && SECS=1
            echo "METRIC db_setup_seconds=$((D1 - D0)) db_bytes=$BYTES mbps=$(( BYTES / 1000000 / SECS ))"
            aws s3 cp "s3://$QUERY_S3_BUCKET/$QUERY_S3_KEY" /tmp/query.fasta
            # taxdb.* sits next to the DB files; BLAST only finds it through BLASTDB, not the -db path.
            export BLASTDB="$(dirname "$DB_PATH")"
            blastdbcmd -db "$DB_PATH" -info > /tmp/dbinfo.txt; head -4 /tmp/dbinfo.txt
            for p in $(seq 1 "$PASSES"); do
              P0=$(date +%s)
              blastn -db "$DB_PATH" -query /tmp/query.fasta -num_threads "$NUM_THREADS" \
                -evalue 1.0E-3 -max_target_seqs 5 \
                -outfmt '6 qseqid qstart qend qcovs qcovhsp qcovus sseqid stitle sstart send evalue bitscore nident pident mismatch gaps sstrand staxids sscinames' \
                -out /tmp/results.pass$p.out
              P1=$(date +%s)
              echo "METRIC pass=$p blast_seconds=$((P1 - P0)) rows=$(wc -l < /tmp/results.pass$p.out) sha256=$(sort /tmp/results.pass$p.out | sha256sum | cut -c1-16)"
            done
            STAMP=$(date +%Y%m%d-%H%M%S)
            aws s3 cp /tmp/results.pass1.out "s3://$QUERY_S3_BUCKET/results/$SCENARIO/results-$STAMP.out"
            echo "METRIC total_seconds=$(( $(date +%s) - T_START ))"
        MountPoints:
          - SourceVolume: nvme
            ContainerPath: /mnt/nvme
            ReadOnly: false
        Volumes:
          - Name: nvme
            Host:
              SourcePath: /mnt/nvme
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group: !Ref LogGroupS3
            awslogs-region: !Ref AWS::Region
            awslogs-stream-prefix: blast

  LogGroupS3:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /${ProjectName}/batch/s3
      RetentionInDays: 14

Outputs:
  JobQueueEFSArn:
    Value: !Ref JobQueueEFS
    Export:
      Name: !Sub ${ProjectName}-job-queue-efs

  JobQueueLustreArn:
    Value: !Ref JobQueueLustre
    Export:
      Name: !Sub ${ProjectName}-job-queue-lustre

  JobQueueS3Arn:
    Value: !Ref JobQueueS3
    Export:
      Name: !Sub ${ProjectName}-job-queue-s3

  JobDefinitionEFS:
    Value: !Ref JobDefinitionEFS

  JobDefinitionLustre:
    Value: !Ref JobDefinitionLustre

  JobDefinitionS3:
    Value: !Ref JobDefinitionS3
